# env.yml
name: onnx-mobile-repro
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - ffmpeg
  - pytorch
  - torchvision
  - pytorch-cuda=12.1
  - matplotlib          # <-- add this
  - pip:
      - numpy>=2.0,<2.3
      - onnx>=1.16
      - onnxruntime-gpu==1.23.2
      - boto3>=1.34,<2
      - opencv-python