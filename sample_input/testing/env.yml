# env.yml
name: onnx-mobile-repro
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - ffmpeg
  # PyTorch + CUDA 12.1 (official way on conda)
  - pytorch
  - torchvision
  - pytorch-cuda=12.1
  - pip:
      - numpy>=2.0,<2.3
      - onnx>=1.16
      - onnxruntime-gpu==1.23.2   # <-- use 1.23.2, not 1.23.1
      - boto3>=1.34,<2
      - opencv-python
